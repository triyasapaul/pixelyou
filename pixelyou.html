<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIXEL YOU — Generative Design System</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=VT323&family=IBM+Plex+Mono:wght@400;700&family=Megrim&family=Montserrat:wght@400;800&family=Oswald:wght@500;700&family=Playfair+Display:wght@700&family=Righteous&family=Space+Grotesk:wght@400;700&family=Space+Mono:wght@400;700&family=Syne:wght@700;800&family=UnifrakturMaguntika&display=swap">
  <!-- Babel for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#fde8f1] overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Helper icon renderer component for Lucide script bundle
    const Icon = ({ name, size = 14, className = "" }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (window.lucide && ref.current) {
          ref.current.innerHTML = `<i data-lucide="${name}" style="width:${size}px; height:${size}px;"></i>`;
          window.lucide.createIcons({
            attrs: { stroke: 'currentColor' },
            nameAttr: 'data-lucide'
          });
        }
      }, [name, size]);
      return <span ref={ref} className={`inline-flex items-center justify-center ${className}`}></span>;
    };

    const TYPEFACES = [
      { name: 'Silkscreen (Y2K Pixel)', value: '"Silkscreen", monospace', category: 'Pixel' },
      { name: 'VT323 (Retro CRT)', value: '"VT323", monospace', category: 'Pixel' },
      { name: 'Press Start 2P', value: '"Press Start 2P", monospace', category: 'Pixel' },
      { name: 'Space Grotesk', value: '"Space Grotesk", sans-serif', category: 'Brutalist' },
      { name: 'Syne (Experimental)', value: '"Syne", sans-serif', category: 'Brutalist' },
      { name: 'Megrim (Abstract)', value: '"Megrim", cursive', category: 'Display' },
      { name: 'Righteous (Retro Sci-Fi)', value: '"Righteous", cursive', category: 'Display' },
      { name: 'UnifrakturMaguntika (Gothic)', value: '"UnifrakturMaguntika", cursive', category: 'Gothic' },
      { name: 'Space Mono', value: '"Space Mono", monospace', category: 'Tech' },
      { name: 'IBM Plex Mono', value: '"IBM Plex Mono", monospace', category: 'Tech' },
      { name: 'Playfair Display', value: '"Playfair Display", serif', category: 'Serif' },
      { name: 'Montserrat', value: '"Montserrat", sans-serif', category: 'Sans' },
      { name: 'Oswald', value: '"Oswald", sans-serif', category: 'Display' }
    ];

    const PRESET_PALETTES = {
      'Candy Pink (Y2K)': { bg: '#fde8f1', primary: '#f472b6', secondary: '#f0abfc', accent: '#c084fc', glitch: '#86efac' },
      'Acid Lime': { bg: '#080A04', primary: '#CCFF00', secondary: '#4ADE80', accent: '#FACC15', glitch: '#FF0055' },
      'Cyber Cyan': { bg: '#030914', primary: '#00F0FF', secondary: '#3B82F6', accent: '#A855F7', glitch: '#FF00A0' },
      'Monochrome': { bg: '#0A0A0A', primary: '#FFFFFF', secondary: '#71717A', accent: '#D4D4D8', glitch: '#CCFF00' },
      'Digital Sunset': { bg: '#10040A', primary: '#FF5500', secondary: '#FF0066', accent: '#AA00FF', glitch: '#00FFFF' },
      'Solar Gold': { bg: '#0F0B03', primary: '#FFB800', secondary: '#FF5500', accent: '#FF0055', glitch: '#00F0FF' },
      'Toxic Violet': { bg: '#0B0314', primary: '#A855F7', secondary: '#EC4899', accent: '#3B82F6', glitch: '#CCFF00' }
    };

    const PIXEL_SHAPES = ['Square', 'Circle', 'Diamond', 'Cross', 'Triangle', 'Star', 'Ring', 'ASCII', 'Flower', 'Random'];

    const DISTORTION_MODES = [
      { id: 'Off', label: 'Off (Clean)' },
      { id: 'Noisy Perlin Displacement', label: 'Perlin Noise' },
      { id: 'Ripple Wave Field', label: 'Ripple Field' },
      { id: 'Pixel Sort Glitch', label: 'Pixel Sort' },
      { id: 'Vortex Twirl Distortion', label: 'Vortex Twirl' },
      { id: 'Particle Scatter Liquid', label: 'Liquid Scatter' }
    ];

    const PATTERN_TYPES = [
      'Checkerboard Matrix', 'Halftone Density', 'Concentric Rings', 'Moiré Waves', 
      'Spirograph Vortex', 'Radial Mandala Grid', 'Crosshatch Weave', 'Matrix Rain Code'
    ];

    const ASCII_CHARS = [' ', '.', ':', '-', '=', '+', '*', '%', '@', '#', '█'];

    function hexToRgb(hex) {
      let c = (hex || '#000000').replace('#', '');
      if (c.length === 3) c = c.split('').map(x => x + x).join('');
      const num = parseInt(c, 16) || 0;
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function lerpColor(color1, color2, factor) {
      const c1 = hexToRgb(color1);
      const c2 = hexToRgb(color2);
      const r = Math.round(c1.r + factor * (c2.r - c1.r));
      const g = Math.round(c1.g + factor * (c2.g - c1.g));
      const b = Math.round(c1.b + factor * (c2.b - c1.b));
      return `rgb(${r},${g},${b})`;
    }

    function App() {
      const [activeTab, setActiveTab] = useState('HOME');
      const [showLeftDrawer, setShowLeftDrawer] = useState(true);
      const [showRightDrawer, setShowRightDrawer] = useState(true);

      const [seed, setSeed] = useState(7771337);
      const [isPlaying, setIsPlaying] = useState(true);
      const [fps, setFps] = useState(60);
      const [audioReactive, setAudioReactive] = useState(false);

      const [bgColor, setBgColor] = useState('#fde8f1');
      const [primaryColor, setPrimaryColor] = useState('#f472b6');
      const [secondaryColor, setSecondaryColor] = useState('#f0abfc');
      const [accentColor, setAccentColor] = useState('#c084fc');
      const [glitchColor, setGlitchColor] = useState('#86efac');
      const [invertColors, setInvertColors] = useState(false);
      const [selectedPreset, setSelectedPreset] = useState('Candy Pink (Y2K)');

      const [pixelSize, setPixelSize] = useState(12);
      const [gridGap, setGridGap] = useState(1);
      const [pixelShape, setPixelShape] = useState('Square');

      const [patternable, setPatternable] = useState(false);
      const [tileRepeatX, setTileRepeatX] = useState(3);
      const [tileRepeatY, setTileRepeatY] = useState(3);

      const [distortionMode, setDistortionMode] = useState('Noisy Perlin Displacement');
      const [motionSpeed, setMotionSpeed] = useState(1.2);
      const [distortionStrength, setDistortionStrength] = useState(16);
      const [noiseFrequency, setNoiseFrequency] = useState(0.02);
      const [rippleSpeed, setRippleSpeed] = useState(1.8);
      const [vortexTwirl, setVortexTwirl] = useState(0);
      const [chromaticJitter, setChromaticJitter] = useState(0);

      const [mouseForce, setMouseForce] = useState('Attract');

      const [textInput, setTextInput] = useState('PIXEL YOU');
      const [fontFamily, setFontFamily] = useState('"Space Grotesk", sans-serif');
      const [letterSpacing, setLetterSpacing] = useState(2);
      const [fontSizeRatio, setFontSizeRatio] = useState(0.4);

      const [numberInput, setNumberInput] = useState('2026.084');
      const [patternType, setPatternType] = useState('Checkerboard Matrix');
      const [uploadedImage, setUploadedImage] = useState(null);

      const [webcamActive, setWebcamActive] = useState(false);
      const videoRef = useRef(null);
      const webcamStreamRef = useRef(null);
      const faceSimPos = useRef({ x: 0.5, y: 0.5, dir: 1 });

      const [layers, setLayers] = useState([
        { id: 1, type: 'TEXT', text: 'CHAOS', shape: 'Square', opacity: 0.8, blend: 'source-over', color: '#f1f0ed' },
        { id: 2, type: 'PATTERN', pattern: 'Moiré Waves', shape: 'Circle', opacity: 0.6, blend: 'screen', color: '#888888' },
        { id: 3, type: 'NUMBER', number: '999', shape: 'Cross', opacity: 0.5, blend: 'difference', color: '#e2e2e2' }
      ]);

      const [archive, setArchive] = useState([]);
      const [isRecording, setIsRecording] = useState(false);
      const recordedChunksRef = useRef([]);

      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      const offscreenCanvasRef = useRef(document.createElement('canvas'));
      const mousePosRef = useRef({ x: -1000, y: -1000, isDown: false, radius: 150 });

      const audioCtxRef = useRef(null);
      const analyserRef = useRef(null);
      const audioDataRef = useRef(new Uint8Array(0));

      const applyPreset = (name) => {
        setSelectedPreset(name);
        const p = PRESET_PALETTES[name];
        if (p) {
          setBgColor(p.bg);
          setPrimaryColor(p.primary);
          setSecondaryColor(p.secondary);
          setAccentColor(p.accent);
          setGlitchColor(p.glitch);
        }
      };

      const toggleFullscreen = () => {
        if (!document.fullscreenElement) {
          containerRef.current?.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      };

      const toggleWebcam = async () => {
        if (webcamActive) {
          if (webcamStreamRef.current) {
            webcamStreamRef.current.getTracks().forEach(t => t.stop());
          }
          setWebcamActive(false);
        } else {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              videoRef.current.play();
            }
            webcamStreamRef.current = stream;
            setWebcamActive(true);
          } catch (err) {
            alert('Webcam permission denied or unavailable.');
          }
        }
      };

      const toggleAudio = async () => {
        if (audioReactive) {
          if (audioCtxRef.current) audioCtxRef.current.close();
          setAudioReactive(false);
        } else {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const src = ctx.createMediaStreamSource(stream);
            const analyser = ctx.createAnalyser();
            analyser.fftSize = 64;
            src.connect(analyser);
            audioCtxRef.current = ctx;
            analyserRef.current = analyser;
            audioDataRef.current = new Uint8Array(analyser.frequencyBinCount);
            setAudioReactive(true);
          } catch (e) {
            console.warn('Audio input error', e);
          }
        }
      };

      const handleRandomize = () => {
        const newSeed = Math.floor(Math.random() * 899999) + 100000;
        setSeed(newSeed);
        setPixelShape(PIXEL_SHAPES[Math.floor(Math.random() * PIXEL_SHAPES.length)]);
        setDistortionStrength(Math.floor(Math.random() * 35) + 5);
        setMotionSpeed(parseFloat((Math.random() * 2.0 + 0.5).toFixed(1)));
        setRippleSpeed(parseFloat((Math.random() * 3.5 + 0.5).toFixed(1)));
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => setUploadedImage(img);
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      };

      const drawShape = (ctx, shape, x, y, size, color, char = 'A', rot = 0) => {
        ctx.save();
        ctx.translate(x, y);
        if (rot !== 0) ctx.rotate(rot);
        ctx.fillStyle = color;
        ctx.strokeStyle = color;
        const r = size / 2;

        switch (shape) {
          case 'Circle':
            ctx.beginPath();
            ctx.arc(0, 0, Math.max(1, r - gridGap), 0, Math.PI * 2);
            ctx.fill();
            break;
          case 'Diamond':
            ctx.beginPath();
            ctx.moveTo(0, -r);
            ctx.lineTo(r, 0);
            ctx.lineTo(0, r);
            ctx.lineTo(-r, 0);
            ctx.closePath();
            ctx.fill();
            break;
          case 'Cross':
            const w = Math.max(1, r / 3);
            ctx.fillRect(-r, -w, size, w * 2);
            ctx.fillRect(-w, -r, w * 2, size);
            break;
          case 'Triangle':
            ctx.beginPath();
            ctx.moveTo(0, -r);
            ctx.lineTo(r, r);
            ctx.lineTo(-r, r);
            ctx.closePath();
            ctx.fill();
            break;
          case 'Star':
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
              ctx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * r, -Math.sin((18 + i * 72) * Math.PI / 180) * r);
              ctx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (r / 2), -Math.sin((54 + i * 72) * Math.PI / 180) * (r / 2));
            }
            ctx.closePath();
            ctx.fill();
            break;
          case 'Ring':
            ctx.lineWidth = Math.max(1.2, size / 4);
            ctx.beginPath();
            ctx.arc(0, 0, Math.max(1, r - gridGap), 0, Math.PI * 2);
            ctx.stroke();
            break;
          case 'ASCII':
            ctx.font = `${Math.floor(size)}px monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(char, 0, 0);
            break;
          case 'Flower':
            for (let i = 0; i < 4; i++) {
              ctx.rotate(Math.PI / 4);
              ctx.beginPath();
              ctx.arc(r / 2, 0, r / 2, 0, Math.PI * 2);
              ctx.fill();
            }
            break;
          case 'Square':
          default:
            ctx.fillRect(-r, -r, Math.max(1, size - gridGap), Math.max(1, size - gridGap));
            break;
        }
        ctx.restore();
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        let animationFrameId;
        let frameCount = 0;
        let fpsInterval = performance.now();

        const render = (time) => {
          const now = performance.now();
          frameCount++;
          if (now - fpsInterval >= 1000) {
            setFps(frameCount);
            frameCount = 0;
            fpsInterval = now;
          }

          let audioAmp = 1;
          if (audioReactive && analyserRef.current) {
            analyserRef.current.getByteFrequencyData(audioDataRef.current);
            let sum = 0;
            for (let i = 0; i < audioDataRef.current.length; i++) sum += audioDataRef.current[i];
            audioAmp = 1 + (sum / audioDataRef.current.length) / 30;
          }

          const rect = canvas.getBoundingClientRect();
          if (canvas.width !== rect.width || canvas.height !== rect.height) {
            canvas.width = Math.max(200, rect.width);
            canvas.height = Math.max(200, rect.height);
          }

          const width = canvas.width;
          const height = canvas.height;

          ctx.fillStyle = invertColors ? '#FFFFFF' : bgColor;
          ctx.fillRect(0, 0, width, height);

          const pSize = Math.max(4, pixelSize);
          const cols = Math.floor(width / pSize);
          const rows = Math.floor(height / pSize);

          const offCanvas = offscreenCanvasRef.current;
          if (offCanvas.width !== cols || offCanvas.height !== rows) {
            offCanvas.width = cols;
            offCanvas.height = rows;
          }
          const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
          offCtx.clearRect(0, 0, cols, rows);

          const drawBuffer = (targetCtx, bCols, bRows) => {
            if (activeTab === 'FACE LAB') {
              if (webcamActive && videoRef.current && videoRef.current.readyState >= 2) {
                targetCtx.drawImage(videoRef.current, 0, 0, bCols, bRows);
              } else {
                const face = faceSimPos.current;
                face.x += 0.005 * face.dir;
                if (face.x > 0.7 || face.x < 0.3) face.dir *= -1;
                const fx = face.x * bCols;
                const fy = face.y * bRows;
                const headR = bCols * 0.22;

                targetCtx.fillStyle = '#050505';
                targetCtx.fillRect(0, 0, bCols, bRows);
                targetCtx.fillStyle = '#FFFFFF';
                targetCtx.beginPath();
                targetCtx.arc(fx, fy, headR, 0, Math.PI * 2);
                targetCtx.fill();
              }
            } else if (activeTab === 'TYPE LAB') {
              targetCtx.fillStyle = '#000000';
              targetCtx.fillRect(0, 0, bCols, bRows);
              targetCtx.fillStyle = '#FFFFFF';
              targetCtx.font = `bold ${Math.floor(bRows * fontSizeRatio)}px ${fontFamily}`;
              targetCtx.textAlign = 'center';
              targetCtx.textBaseline = 'middle';
              targetCtx.letterSpacing = `${letterSpacing}px`;
              targetCtx.fillText(textInput || 'PIXEL YOU', bCols / 2, bRows / 2);
            } else if (activeTab === 'NUMBER LAB') {
              targetCtx.fillStyle = '#000000';
              targetCtx.fillRect(0, 0, bCols, bRows);
              targetCtx.fillStyle = '#FFFFFF';
              targetCtx.font = `bold ${Math.floor(bRows * 0.35)}px monospace`;
              targetCtx.textAlign = 'center';
              targetCtx.textBaseline = 'middle';
              targetCtx.fillText(numberInput || '0000', bCols / 2, bRows / 2);
            } else if (activeTab === 'IMAGE LAB' && uploadedImage) {
              targetCtx.drawImage(uploadedImage, 0, 0, bCols, bRows);
            } else if (activeTab === 'PATTERN LAB') {
              const t = time * 0.001 * motionSpeed;
              for (let r = 0; r < bRows; r++) {
                for (let c = 0; c < bCols; c++) {
                  let val = 0;
                  const nx = c / bCols - 0.5;
                  const ny = r / bRows - 0.5;
                  const dist = Math.sqrt(nx * nx + ny * ny);

                  switch (patternType) {
                    case 'Halftone Density':
                      val = (Math.sin(c * 0.5) + Math.cos(r * 0.5)) > 0 ? 255 : 0;
                      break;
                    case 'Concentric Rings':
                      val = Math.sin(dist * 28 - t * 5) > 0 ? 255 : 0;
                      break;
                    case 'Moiré Waves':
                      val = Math.sin(c * 0.2 + t) * Math.cos(r * 0.2 + t) > 0 ? 255 : 0;
                      break;
                    case 'Spirograph Vortex':
                      val = Math.sin(Math.atan2(ny, nx) * 8 + dist * 20 - t * 3) > 0 ? 255 : 0;
                      break;
                    case 'Radial Mandala Grid':
                      val = Math.sin(dist * 35) * Math.cos(Math.atan2(ny, nx) * 10) > 0 ? 255 : 0;
                      break;
                    case 'Crosshatch Weave':
                      val = ((c + r) % 6 === 0 || (c - r) % 6 === 0) ? 255 : 0;
                      break;
                    case 'Matrix Rain Code':
                      val = (r + Math.floor(t * 10 + c * 3)) % 8 === 0 ? 255 : 0;
                      break;
                    case 'Checkerboard Matrix':
                    default:
                      val = ((c + r) % 2 === 0) ? 255 : 0;
                      break;
                  }
                  targetCtx.fillStyle = `rgb(${val},${val},${val})`;
                  targetCtx.fillRect(c, r, 1, 1);
                }
              }
            } else if (activeTab === 'CHAOS MODE') {
              targetCtx.fillStyle = '#000000';
              targetCtx.fillRect(0, 0, bCols, bRows);
              layers.forEach((l) => {
                if (l.opacity <= 0) return;
                targetCtx.globalAlpha = l.opacity;
                targetCtx.globalCompositeOperation = l.blend || 'source-over';
                targetCtx.fillStyle = l.color || '#FFFFFF';

                if (l.type === 'TEXT') {
                  targetCtx.font = `bold ${Math.floor(bRows * 0.35)}px monospace`;
                  targetCtx.textAlign = 'center';
                  targetCtx.textBaseline = 'middle';
                  targetCtx.fillText(l.text || 'CHAOS', bCols / 2, bRows / 2);
                } else if (l.type === 'PATTERN') {
                  targetCtx.fillRect(bCols * 0.1, bRows * 0.1, bCols * 0.8, bRows * 0.8);
                }
              });
              targetCtx.globalAlpha = 1.0;
              targetCtx.globalCompositeOperation = 'source-over';
            }
          };

          if (patternable) {
            const tileW = Math.max(1, Math.floor(cols / tileRepeatX));
            const tileH = Math.max(1, Math.floor(rows / tileRepeatY));
            const tileCanvas = document.createElement('canvas');
            tileCanvas.width = tileW;
            tileCanvas.height = tileH;
            const tileCtx = tileCanvas.getContext('2d');

            drawBuffer(tileCtx, tileW, tileH);

            for (let ty = 0; ty < tileRepeatY; ty++) {
              for (let tx = 0; tx < tileRepeatX; tx++) {
                offCtx.drawImage(tileCanvas, tx * tileW, ty * tileH);
              }
            }
          } else {
            drawBuffer(offCtx, cols, rows);
          }

          let imgData;
          try {
            imgData = offCtx.getImageData(0, 0, cols, rows).data;
          } catch (e) {
            imgData = new Uint8ClampedArray(cols * rows * 4);
          }

          const t = time * 0.001 * motionSpeed;
          const mouse = mousePosRef.current;

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const idx = (r * cols + c) * 4;
              const red = imgData[idx];
              const green = imgData[idx + 1];
              const blue = imgData[idx + 2];
              const alpha = imgData[idx + 3];

              let lum = (0.299 * red + 0.587 * green + 0.114 * blue) / 255;
              if (alpha === 0) lum = 0;

              let targetX = c * pSize + pSize / 2;
              let targetY = r * pSize + pSize / 2;

              if (isPlaying && distortionMode !== 'Off') {
                const freq = noiseFrequency;
                const amp = distortionStrength * audioAmp;

                if (distortionMode === 'Noisy Perlin Displacement') {
                  targetX += Math.sin(c * freq + t) * amp;
                  targetY += Math.cos(r * freq + t) * amp;
                } else if (distortionMode === 'Ripple Wave Field') {
                  const dx = c - cols / 2;
                  const dy = r - rows / 2;
                  const dist = Math.sqrt(dx * dx + dy * dy);
                  targetX += Math.sin(dist * freq * 5 - t * rippleSpeed) * amp;
                  targetY += Math.cos(dist * freq * 5 - t * rippleSpeed) * amp;
                } else if (distortionMode === 'Pixel Sort Glitch') {
                  if (Math.random() < amp * 0.008) {
                    targetX += (Math.random() - 0.5) * amp * 4;
                  }
                } else if (distortionMode === 'Vortex Twirl Distortion') {
                  const dx = targetX - width / 2;
                  const dy = targetY - height / 2;
                  const dist = Math.sqrt(dx * dx + dy * dy);
                  const angle = (vortexTwirl * 0.01) * (dist / 100);
                  targetX = width / 2 + dx * Math.cos(angle) - dy * Math.sin(angle);
                  targetY = height / 2 + dx * Math.sin(angle) + dy * Math.cos(angle);
                } else if (distortionMode === 'Particle Scatter Liquid') {
                  targetX += Math.sin(c * 0.1 + t) * (1 - lum) * amp;
                  targetY += Math.cos(r * 0.1 + t) * (1 - lum) * amp;
                }
              }

              if (chromaticJitter > 0) {
                targetX += (Math.random() - 0.5) * chromaticJitter;
              }

              const dx = targetX - mouse.x;
              const dy = targetY - mouse.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < mouse.radius) {
                const force = (1 - dist / mouse.radius) * distortionStrength * 2;
                if (mouseForce === 'Attract') {
                  targetX -= (dx / dist) * force * 5;
                  targetY -= (dy / dist) * force * 5;
                } else if (mouseForce === 'Repel') {
                  targetX += (dx / dist) * force * 8;
                  targetY += (dy / dist) * force * 8;
                } else if (mouseForce === 'Explode' && mouse.isDown) {
                  targetX += (dx / dist) * force * 25;
                  targetY += (dy / dist) * force * 25;
                }
              }

              let drawColor;
              if (invertColors) {
                drawColor = lerpColor(bgColor, primaryColor, lum);
              } else {
                if (lum > 0.05) {
                  const colorFactor = Math.sin(c * 0.05 + r * 0.05 + t) * 0.5 + 0.5;
                  drawColor = lerpColor(primaryColor, secondaryColor, colorFactor);
                } else {
                  drawColor = bgColor;
                }
              }

              if (lum > 0.02 || activeTab === 'PATTERN LAB') {
                const charIdx = Math.floor(lum * (ASCII_CHARS.length - 1));
                const char = ASCII_CHARS[charIdx] || '@';
                const renderSize = pSize * (0.4 + lum * 0.8) * audioAmp;

                drawShape(
                  ctx,
                  pixelShape,
                  targetX,
                  targetY,
                  renderSize,
                  drawColor,
                  char,
                  (c + r) * 0.08
                );
              }
            }
          }

          if (isPlaying) {
            animationFrameId = requestAnimationFrame(render);
          }
        };

        animationFrameId = requestAnimationFrame(render);
        return () => cancelAnimationFrame(animationFrameId);

        isPlaying, pixelSize, gridGap, pixelShape, bgColor, primaryColor,

                    <div className="grid grid-cols-2 gap-1.5">
                      <div className="bg-white p-1.5 rounded-2xl border border-[#F2C2D4] flex items-center justify-between">
                        <span className="text-[9px]">BG</span>
                        <input type="color" value={bgColor} onChange={(e) => setBgColor(e.target.value)} className="w-5 h-5 rounded-full cursor-pointer border-none bg-transparent" />
                      </div>
                      <div className="bg-white p-1.5 rounded-2xl border border-[#F2C2D4] flex items-center justify-between">
                        <span className="text-[9px]">MAIN</span>
                        <input type="color" value={primaryColor} onChange={(e) => setPrimaryColor(e.target.value)} className="w-5 h-5 rounded-full cursor-pointer border-none bg-transparent" />
                      </div>
                      <div className="bg-white p-1.5 rounded-2xl border border-[#F2C2D4] flex items-center justify-between">
                        <span className="text-[9px]">ACCENT</span>
                        <input type="color" value={secondaryColor} onChange={(e) => setSecondaryColor(e.target.value)} className="w-5 h-5 rounded-full cursor-pointer border-none bg-transparent" />
                      </div>
                      <div className="bg-white p-1.5 rounded-2xl border border-[#F2C2D4] flex items-center justify-between">
                        <span className="text-[9px]">GLITCH</span>
                        <input type="color" value={glitchColor} onChange={(e) => setGlitchColor(e.target.value)} className="w-5 h-5 rounded-full cursor-pointer border-none bg-transparent" />
                      </div>
                    </div>
                  </div>

                  <div className="space-y-1 pt-2 border-t border-[#FCE4EC]">
                    <span className="text-[10px] text-[#803050] block font-bold">PIXEL SHAPE</span>
                    <div className="grid grid-cols-2 gap-1">
                      {PIXEL_SHAPES.map(s => (
                        <button
                          key={s}
                          onClick={() => setPixelShape(s)}
                          className={`py-1 px-1.5 rounded-xl text-[9px] text-center border ${
                            pixelShape === s 
                              ? 'bg-[#E872A4] text-white font-bold border-[#D87A9F]' 
                              : 'bg-white text-[#602040] border-[#F2C2D4]'
                          }`}
                        >
                          {s}
                        </button>
                      ))}
                    </div>
                  </div>

                </div>

              </div>
            </div>

            {!showRightDrawer && (
              <button
                onClick={() => setShowRightDrawer(true)}
                className="absolute top-4 right-4 z-30 p-2 rounded-full bg-[#F7A5C8] border-2 border-white text-white shadow-lg hover:scale-110 transition-all"
              >
                <Icon name="chevron-left" size={16} />
              </button>
            )}

          </div>

          {/* FOOTER STATUS BAR */}
          <footer className="mt-2 w-full max-w-5xl mx-auto z-30">
            <div className="bg-gradient-to-r from-[#F9C3D9] via-[#F3A5C5] to-[#E882AF] px-4 py-1.5 rounded-full border-2 border-[#E083A8] shadow-md flex items-center justify-between text-[10px] font-mono text-[#602040]">
              <div className="flex items-center space-x-2">
                <span className="w-2 h-2 rounded-full bg-[#B2E053] inline-block animate-ping"></span>
                <span className="font-bold">{"STATUS: ONLINE <3"}</span>
              </div>
              <div className="flex items-center space-x-3 font-bold">
                <span>FPS: {fps}</span>
                <span>#SEED-{seed}</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
